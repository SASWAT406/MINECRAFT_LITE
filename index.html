<!DOCTYPE HTML>
<html>
    <head>
        <title>WebCraft - Custom Mod</title>
        
        <meta http-equiv="content-type" content="text/html; charset=ISO-8859-1">
        
        <link href="style/main.css?v=99" rel="stylesheet" type="text/css">
        
        <style>
            #crosshair {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 20px;
                height: 20px;
                /* This makes the + sign using a text character */
                content: "+";
                color: white;
                font-size: 30px;
                font-family: monospace;
                font-weight: bold;
                text-align: center;
                line-height: 20px;
                transform: translate(-50%, -50%);
                pointer-events: none; /* Let clicks pass through it */
                z-index: 10;
                text-shadow: 1px 1px 0 #000; /* Black outline for visibility */
            }
        </style>
        
        <script src="js/glMatrix-1.2.min.js?v=99" type="text/javascript"></script>
        <script src="js/blocks.js?v=99" type="text/javascript"></script>
        <script src="js/helpers.js?v=99" type="text/javascript"></script>
        <script src="js/world.js?v=99" type="text/javascript"></script>
        <script src="js/render.js?v=99" type="text/javascript"></script>
        <script src="js/physics.js?v=99" type="text/javascript"></script>
        <script src="js/player.js?v=99" type="text/javascript"></script>
    </head>
    
    <body oncontextmenu="return false">
        <div id="crosshair">+</div>

        <canvas id="renderSurface"></canvas>
        
        <table id="materialSelector">
            <tr></tr>
        </table>
        
        <script type="text/javascript">         
            // Create a new flat world (Updated Size: 64x32x64)
            var world = new World( 64, 32, 64 );
            world.createFlatWorld( 6 );
            
            // Set up renderer (Updated View Distance: 500)
            var render = new Renderer( "renderSurface" );
            render.setWorld( world, 8 );
            render.setPerspective( 60, 0.01, 500 );
            
            // Create physics simulator
            var physics = new Physics();
            physics.setWorld( world );
            
            // Create new local player
            var player = new Player();
            player.setWorld( world );
            player.setInputCanvas( "renderSurface" );
            player.setMaterialSelector( "materialSelector" );
            
            // --- MOUSE LOCK & CONTROLS ---
            document.addEventListener('mousemove', function(e) {
                if (document.pointerLockElement === canvas) {
                    
                    // --- SENSITIVITY ---
                    // Previous was 0.02. Now it is 0.002 (Very smooth/slow)
                    var sensitivity = 0.002; 
                    
                    // --- DIRECTIONS ---
                    var directionY = -1;  // Mouse Up = Look Up
                    var directionX = -1;  // Mouse Right = Turn Right
                    
                    // --- MOVEMENT LOGIC ---
                    player.angles[0] += e.movementY * sensitivity * directionY; 
                    player.angles[1] -= e.movementX * sensitivity * directionX;

                    // --- THE FIX: CLAMP VERTICAL ROTATION (RADIANS) ---
                    // We use Math.PI / 2 instead of 90.
                    // This stops the camera exactly at straight up and straight down.
                    
                    var verticalLimit = Math.PI / 2; 

                    if (player.angles[0] < -verticalLimit) {
                        player.angles[0] = -verticalLimit;
                    }
                    if (player.angles[0] > verticalLimit) {
                        player.angles[0] = verticalLimit;
                    }
                }
            }, false);
            
            // Render loop          
            setInterval( function()
            {
                var time = new Date().getTime() / 1000.0;
                
                // Simulate physics
                physics.simulate();
                
                // Update local player
                player.update();
                
                // --- INVISIBLE BORDER LOGIC ---
                var borderBuffer = 1.5; 
                var limitX = 64; // Must match world width
                var limitZ = 64; // Must match world depth

                if (player.pos.x < borderBuffer) player.pos.x = borderBuffer;
                if (player.pos.x > limitX - borderBuffer) player.pos.x = limitX - borderBuffer;
                
                if (player.pos.z < borderBuffer) player.pos.z = borderBuffer;
                if (player.pos.z > limitZ - borderBuffer) player.pos.z = limitZ - borderBuffer;

                // Build a chunk
                render.buildChunks( 1 );
                
                // Draw world
                render.setCamera( player.getEyePos().toArray(), player.angles );
                render.draw();
                
                while ( new Date().getTime() / 1000 - time < 0.016 );
            }, 1 );
        </script>
    </body>
</html>
