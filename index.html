<!DOCTYPE HTML>
<html>
	<head>
		<title>WebCraft</title>
		
		<!-- Character encoding -->
		<meta http-equiv="content-type" content="text/html; charset=ISO-8859-1">
		
		<!-- Stylesheet -->
		<link href="style/main.css" rel="stylesheet" type="text/css">
		
		<!-- Modules -->
		<script src="js/glMatrix-1.2.min.js" type="text/javascript"></script>
		<script src="js/blocks.js" type="text/javascript"></script>
		<script src="js/helpers.js" type="text/javascript"></script>
		<script src="js/world.js" type="text/javascript"></script>
		<script src="js/render.js" type="text/javascript"></script>
		<script src="js/physics.js" type="text/javascript"></script>
		<script src="js/player.js" type="text/javascript"></script>
	</head>
	
	<body oncontextmenu="return false">
		<!-- Render surface -->
		<canvas id="renderSurface"></canvas>
		
		<!-- Material selection -->
		<table id="materialSelector">
			<tr></tr>
		</table>
		
		<!-- Initialisation code -->
		<script type="text/javascript">			
			// Create a new flat world
			var world = new World( 64, 32, 64 );
			world.createFlatWorld( 6 );
			
			// Set up renderer
			var render = new Renderer( "renderSurface" );
			render.setWorld( world, 8 );
			render.setPerspective( 60, 0.01, 500 );
			
			// Create physics simulator
			var physics = new Physics();
			physics.setWorld( world );
			
			// Create new local player
			var player = new Player();
			player.setWorld( world );
			player.setInputCanvas( "renderSurface" );
			player.setMaterialSelector( "materialSelector" );
			// --- START OF MOUSE LOCK CODE ---
			var canvas = document.getElementById("renderSurface");

			// 1. When you click the game, lock the cursor
			canvas.onclick = function() {
   			canvas.requestPointerLock();
};

// 2. Listen for mouse movement
			document.addEventListener('mousemove', function(e) {
    if (document.pointerLockElement === canvas) {
        // Update player angles based on mouse movement
        // You might need to adjust the '0.1' sensitivity
        player.angles[0] -= e.movementY * 0.1; 
        player.angles[1] -= e.movementX * 0.1;
        
        // Keep looking up/down within limits (so you don't break your neck)
        player.angles[0] = Math.max(-90, Math.min(90, player.angles[0]));
    }
}, false);
// --- END OF MOUSE LOCK CODE ---
			
			// Render loop			
			setInterval( function()
			{
				var time = new Date().getTime() / 1000.0;
				
				// Simulate physics
				physics.simulate();
				
				// Update local player
				player.update();
				
				// Build a chunk
				render.buildChunks( 1 );
				
				// Draw world
				render.setCamera( player.getEyePos().toArray(), player.angles );
				render.draw();
				
				while ( new Date().getTime() / 1000 - time < 0.016 );
			}, 1 );
		</script>
	</body>
</html>
