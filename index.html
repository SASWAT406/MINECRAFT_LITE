<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Web Creative Mode</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        
        /* UI OVERLAY */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #crosshair { 
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; 
            background: url('https://raw.githubusercontent.com/ozantogu/minecraft-icons/main/crosshair.png') no-repeat center;
            background-size: contain; transform: translate(-50%, -50%); 
        }
        
        /* HOTBAR */
        #hotbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; background: rgba(0, 0, 0, 0.5); padding: 5px; border-radius: 5px;
        }
        .slot {
            width: 40px; height: 40px; border: 2px solid #555; background-size: cover; background-color: rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; text-shadow: 1px 1px 0 #000;
        }
        .active { border-color: white; box-shadow: 0 0 5px white; }

        /* INSTRUCTIONS */
        #instructions {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7); color: white; padding: 20px; text-align: center;
            border: 2px solid white; pointer-events: auto; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="hotbar">
            <div class="slot active" id="slot-1" style="background-image: url('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/minecraft/grass.png');">1</div>
            <div class="slot" id="slot-2" style="background-image: url('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/minecraft/dirt.png');">2</div>
            <div class="slot" id="slot-3" style="background-image: url('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/minecraft/atlas.png'); background-position: -32px 0;">3</div> <div class="slot" id="slot-4" style="background-color: #8B4513;">4</div> <div class="slot" id="slot-5" style="background-color: #228B22;">5</div> <div class="slot" id="slot-6" style="background-color: #ADD8E6; opacity: 0.8;">6</div> </div>
    </div>

    <div id="instructions">
        <h1>Minecraft Creative Web</h1>
        <p>Click to Start</p>
        <p><b>WASD</b> Move | <b>SPACE</b> Jump/Fly</p>
        <p><b>Click</b> Place Block | <b>Right Click</b> Destroy</p>
        <p><b>1-6</b> Change Block Type</p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- GLOBAL VARIABLES ---
        let camera, scene, renderer, controls;
        const objects = []; // Holds all blocks for collision/raycasting
        let raycaster;
        
        // Movement
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, moveUp = false, moveDown = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        // Game State
        let selectedBlock = 'grass'; // Default block
        
        // Textures (Loading from a stable CDN)
        const loader = new THREE.TextureLoader();
        const textureGrass = loader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/minecraft/grass.png');
        const textureDirt = loader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/minecraft/dirt.png');
        // Using NearestFilter gives that pixelated "Minecraft" look
        textureGrass.magFilter = THREE.NearestFilter;
        textureDirt.magFilter = THREE.NearestFilter;

        // Material Library
        const materials = {
            'grass': new THREE.MeshLambertMaterial({ map: textureGrass }),
            'dirt': new THREE.MeshLambertMaterial({ map: textureDirt }),
            'stone': new THREE.MeshLambertMaterial({ color: 0x808080 }), // Grey
            'wood': new THREE.MeshLambertMaterial({ color: 0x8B4513 }),  // Brown
            'leaves': new THREE.MeshLambertMaterial({ color: 0x228B22 }), // Dark Green
            'glass': new THREE.MeshLambertMaterial({ color: 0xADD8E6, transparent: true, opacity: 0.6 })
        };

        init();
        animate();

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky Blue
            scene.fog = new THREE.Fog(0x87CEEB, 10, 600); // Distance fog

            // 2. Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 20, 0);

            // 3. Lighting (Sun + Ambient)
            const ambientLight = new THREE.AmbientLight(0xcccccc);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(1, 1, 0.5).normalize();
            scene.add(directionalLight);

            // 4. Input / Controls
            controls = new PointerLockControls(camera, document.body);
            const instructions = document.getElementById('instructions');
            
            instructions.addEventListener('click', () => controls.lock());
            controls.addEventListener('lock', () => instructions.style.display = 'none');
            controls.addEventListener('unlock', () => instructions.style.display = 'block');
            scene.add(controls.getObject());

            // Key Listeners
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);

            // 5. World Generation (Flat World + Trees)
            generateFlatWorld();
            generateTrees();

            // 6. Raycaster (Interaction)
            raycaster = new THREE.Raycaster();
            raycaster.far = 100; // Reach distance

            // 7. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: false }); // False for retro feel
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            window.addEventListener('resize', onWindowResize);
        }

        function generateFlatWorld() {
            // Create a large flat floor of grass blocks (Simplified as one large plane for performance, but added blocks for interaction)
            // Real Minecraft logic: Actually placing individual blocks for the floor is too heavy for a simple browser prototype.
            // Trick: We place a huge "Bedrock" plane, then place some grass blocks near the center to start.
            
            const geometry = new THREE.PlaneGeometry(2000, 2000);
            geometry.rotateX(-Math.PI / 2);
            const plane = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color: 0x55a630 })); // Grass color base
            plane.position.y = -2.5; // Slightly below block level
            scene.add(plane);
            objects.push(plane); // You can build on this

            // Let's add a starting platform of real blocks
            for(let x = -10; x < 10; x++) {
                for(let z = -10; z < 10; z++) {
                    createBlock(x * 5, 0, z * 5, 'grass');
                }
            }
        }

        function generateTrees() {
            // Randomly place trees
            for (let i = 0; i < 20; i++) {
                const x = (Math.random() * 400 - 200);
                const z = (Math.random() * 400 - 200);
                // Snap to grid
                const gridX = Math.round(x / 5) * 5;
                const gridZ = Math.round(z / 5) * 5;

                createTree(gridX, 2.5, gridZ);
            }
        }

        function createTree(x, y, z) {
            // Trunk (3 blocks high)
            createBlock(x, y, z, 'wood');
            createBlock(x, y + 5, z, 'wood');
            createBlock(x, y + 10, z, 'wood');

            // Leaves (Simple Cluster)
            for(let i=-1; i<=1; i++) {
                for(let j=-1; j<=1; j++) {
                    createBlock(x + (i*5), y + 15, z + (j*5), 'leaves');
                }
            }
            createBlock(x, y + 20, z, 'leaves');
        }

        function createBlock(x, y, z, type) {
            const geometry = new THREE.BoxGeometry(5, 5, 5);
            const material = materials[type];
            const voxel = new THREE.Mesh(geometry, material);
            voxel.position.set(x, y, z);
            scene.add(voxel);
            objects.push(voxel);
            return voxel;
        }

        // --- EVENT HANDLERS ---

        function onKeyDown(event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = true; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                case 'ArrowRight': case 'KeyD': moveRight = true; break;
                case 'Space': if(controls.isLocked) velocity.y += 10; break; // Jump/Fly
                
                // Inventory Selection
                case 'Digit1': updateHotbar('grass', 1); break;
                case 'Digit2': updateHotbar('dirt', 2); break;
                case 'Digit3': updateHotbar('stone', 3); break;
                case 'Digit4': updateHotbar('wood', 4); break;
                case 'Digit5': updateHotbar('leaves', 5); break;
                case 'Digit6': updateHotbar('glass', 6); break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = false; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                case 'ArrowRight': case 'KeyD': moveRight = false; break;
            }
        }

        function updateHotbar(blockType, slotNum) {
            selectedBlock = blockType;
            // Clear active class
            document.querySelectorAll('.slot').forEach(el => el.classList.remove('active'));
            // Add active class to selected
            document.getElementById(`slot-${slotNum}`).classList.add('active');
        }

        function onMouseDown(event) {
            if (!controls.isLocked) return;
            
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(objects, false);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                
                // LEFT CLICK (0): Place Block
                if (event.button === 0) {
                    const voxel = createBlock(0,0,0, selectedBlock);
                    voxel.position.copy(intersect.point).add(intersect.face.normal);
                    voxel.position.divideScalar(5).floor().multiplyScalar(5).addScalar(2.5);
                }
                // RIGHT CLICK (2): Remove Block
                else if (event.button === 2) {
                    if (intersect.object.geometry.type === 'BoxGeometry') { // Don't delete the floor plane
                        scene.remove(intersect.object);
                        objects.splice(objects.indexOf(intersect.object), 1);
                    }
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked === true) {
                const delta = 0.015; // fixed time step simulation

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 100.0 * delta * 0.01; // Gravity (very light)

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 1200.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 1200.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                
                // Simple floor collision to stop falling forever
                if (camera.position.y < 10) {
                    velocity.y = 0;
                    camera.position.y = 10;
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
